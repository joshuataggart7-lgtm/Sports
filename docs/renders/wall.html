<!doctype html><html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: "Barlow Condensed", "Arial Narrow", Arial, sans-serif; color: #fff; }
  .room { position: absolute; inset: 0; background: linear-gradient(180deg, #16181d 0%, #1b1d23 55%, #0f1013 100%); }
  .room.movie { background: linear-gradient(180deg, #0a0b0e 0%, #0d0e12 55%, #07080a 100%); }
  .ceiling { position: absolute; left: 0; right: 0; top: 0; height: 70px; background: linear-gradient(180deg, #0b0c0f, #15171c); }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 190px; background: linear-gradient(180deg, #3a2a1f 0%, #241a13 100%); }
  .floor::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 140px, rgba(0,0,0,.25) 140px 142px); }
  .wallglow { position: absolute; left: 0; right: 0; top: 70px; height: 40px; background: linear-gradient(180deg, var(--accent, #CE1126) 0%, transparent 100%); opacity: .55; filter: blur(14px); }
  .housing { position: absolute; left: 110px; width: 1700px; top: 78px; height: 26px; background: linear-gradient(180deg, #e8e8e8, #b9b9b9); border-radius: 6px; box-shadow: 0 6px 14px rgba(0,0,0,.6); }
  .strip { position: absolute; left: 112px; width: 1696px; top: 104px; height: 132px; background: #d8d8d8; overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,.6); }
  .strip img { position: absolute; left: 0; top: 0; width: 1696px; height: 132px; object-fit: cover; object-position: left center; filter: brightness(1.05) contrast(1.05); }
  .strip .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.05)); }
  .strip.full { height: 760px; z-index: 5; }
  .strip.full .movie { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, #2a3a55 0%, #0b0f18 60%, #05070c 100%); display: flex; align-items: center; justify-content: center; }
  .strip.full .movie .bars { position: absolute; left: 0; right: 0; height: 90px; background: #000; }
  .tv { position: absolute; background: #000; border: 6px solid #0a0a0a; border-radius: 4px; box-shadow: 0 0 0 1px #2a2a2a, 0 20px 50px rgba(0,0,0,.7); overflow: hidden; }
  .tv img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tv.off { background: #050505; }
  .tv.off > * { display: none; }
  .bias { position: absolute; left: 540px; top: 300px; width: 840px; height: 460px; background: var(--accent, #CE1126); filter: blur(60px); opacity: .55; border-radius: 40px; }
  .broadcast { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 70%, #2f6b36 0%, #1a4521 45%, #0b1e10 100%); }
  .broadcast::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 60px, rgba(255,255,255,.08) 60px 63px); opacity: .5; }
  .broadcast .label { position: absolute; left: 20px; top: 16px; font-size: 20px; letter-spacing: .25em; text-transform: uppercase; color: rgba(255,255,255,.55); }
  .broadcast .bug { position: absolute; left: 24px; bottom: 22px; width: 560px; height: 62px; overflow: hidden; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
  .broadcast .bug img { position: absolute; left: 0; top: 0; width: 1012px; height: 112px; object-fit: cover; object-position: 0 -36px; transform: scale(.555); transform-origin: top left; }
  .broadcast .bug { height: 48px; width: 500px; }
  .broadcast .bug img { object-position: 0 -44px; height: 86px; width: 900px; }
  .console { position: absolute; left: 700px; width: 520px; top: 830px; height: 70px; background: linear-gradient(180deg, #d9d2c6, #b7ad9c); border-radius: 4px; box-shadow: 0 10px 20px rgba(0,0,0,.6); }
  .console .gear { position: absolute; left: 24px; right: 24px; top: 18px; height: 34px; background: #111; border-radius: 3px; }
  .console .gear i { position: absolute; top: 14px; width: 6px; height: 6px; border-radius: 50%; background: #34c759; box-shadow: 0 0 6px #34c759; }
  .loveseat { position: absolute; left: 610px; width: 700px; bottom: 0; height: 150px; background: linear-gradient(180deg, #3b3f47, #262930); border-radius: 60px 60px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.5); }
  .loveseat::before { content: ""; position: absolute; left: 40px; right: 40px; top: 46px; height: 60px; background: #30343b; border-radius: 30px; }
  .caption { position: absolute; left: 32px; bottom: 24px; max-width: 1600px; font-size: 22px; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.55); }
  .caption b { color: #fff; }
  .ipad { position: absolute; right: 34px; bottom: 30px; width: 190px; border: 8px solid #111; border-radius: 22px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,.7); background: #000; }
  .ipad img { width: 100%; display: block; }
  .ipad::after { content: "iPad · control"; position: absolute; left: 0; right: 0; bottom: 0; padding: 4px; font-size: 12px; text-align: center; letter-spacing: .2em; text-transform: uppercase; background: rgba(0,0,0,.7); color: rgba(255,255,255,.7); }
  .speaker { position: absolute; width: 60px; height: 100px; background: linear-gradient(180deg, #2b2b2b, #151515); border-radius: 6px; box-shadow: 0 10px 20px rgba(0,0,0,.6); }
  .fog { position: absolute; left: 1500px; bottom: 150px; width: 420px; height: 420px; background: radial-gradient(ellipse at 30% 80%, rgba(255,255,255,.35), transparent 60%); filter: blur(30px); }
</style></head><body>
<div class="room" id="room">
  <div class="ceiling"></div>
  <div class="wallglow"></div>
  <div class="housing"></div>
  <div class="strip" id="strip"><img id="ribbon" src="projector-ribbon-crop.png"><div class="shade"></div></div>
  <div class="bias" id="bias"></div>
  <div class="tv" id="left"  style="left:112px; top:430px; width:440px; height:250px;"><img src="display-stats.png"></div>
  <div class="tv" id="sony"  style="left:605px; top:330px; width:710px; height:400px;"><div class="broadcast"><div class="label">Live broadcast · YouTube TV</div><div class="bug"><img src="projector-ribbon-crop.png"></div></div></div>
  <div class="tv" id="right" style="left:1368px; top:430px; width:440px; height:250px;"><img src="display-league-scores.png"></div>
  <div class="speaker" style="left:555px; top:560px;"></div>
  <div class="speaker" style="left:1305px; top:560px;"></div>
  <div class="console"><div class="gear"><i style="left:30px"></i><i style="left:120px"></i><i style="left:210px"></i></div></div>
  <div class="floor"></div>
  <div class="loveseat"></div>
  <div class="caption" id="cap"><b>Game Day</b> · ribbon on the dropped screen · stats · broadcast · league scores · bias light in team color</div>
  <div class="ipad"><img src="phone-live.png"></div>
</div>
<script>
  const mode = new URLSearchParams(location.search).get("mode") || "gameday";
  if (mode === "touchdown") {
    document.getElementById("ribbon").src = "projector-touchdown.png";
    document.getElementById("right").querySelector("img").src = "display-touchdown-overlay.png";
    document.getElementById("bias").style.opacity = ".95";
    document.querySelector(".wallglow").style.opacity = ".9";
    document.getElementById("cap").innerHTML = "<b>Touchdown</b> · ribbon takeover · bias lights flash · LED strip pulses · horn and goal light · fog puff";
    const f = document.createElement("div"); f.className = "fog"; document.getElementById("room").appendChild(f);
  }
  if (mode === "movie") {
    document.getElementById("room").classList.add("movie");
    const s = document.getElementById("strip"); s.classList.add("full"); s.innerHTML = '<div class="movie"><div class="bars" style="top:0"></div><div class="bars" style="bottom:0"></div><div style="font-size:42px;letter-spacing:.4em;text-transform:uppercase;color:rgba(255,255,255,.25)">Feature presentation</div></div>';
    for (const id of ["left", "sony", "right"]) document.getElementById(id).classList.add("off");
    document.getElementById("bias").style.opacity = "0";
    document.querySelector(".wallglow").style.opacity = ".08";
    document.querySelector(".housing").style.filter = "brightness(.5)";
    document.getElementById("cap").innerHTML = "<b>Movie</b> · screen fully down over the TV array · Horizon Pro on · TVs and ribbon off · lights to theater";
  }
</script>
</body></html>
