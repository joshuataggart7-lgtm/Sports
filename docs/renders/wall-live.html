<!doctype html><html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0d0e11 url(wall7-gameday.png) no-repeat 0 0; font-family: "Barlow Condensed", "Arial Narrow", Arial, sans-serif; color: #fff; }
  #side { position: absolute; left: 1460px; top: 0; width: 460px; height: 1080px; background: #0d0e11; }
  .frame { position: absolute; overflow: hidden; background: #000; }
  .frame iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; }
  #glow { position: absolute; left: 440px; top: 400px; width: 640px; height: 380px; border-radius: 40px; background: #1e3a8a; filter: blur(60px); opacity: .45; transition: background .4s; z-index: 0; }
  #sony { position: absolute; left: 492px; top: 430px; width: 529px; height: 305px; z-index: 2; background: radial-gradient(ellipse at 50% 70%, #2f6b36 0%, #1a4521 45%, #0b1e10 100%); border: 4px solid #0a0a0a; }
  #sony::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 48px, rgba(255,255,255,.08) 48px 50px); opacity: .5; }
  #sony span { position: absolute; left: 14px; top: 10px; font-size: 16px; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.6); }
  #cap { position: absolute; left: 1490px; top: 120px; width: 400px; }
  #cap h1 { margin: 0 0 10px; font-size: 44px; line-height: 1; letter-spacing: .03em; text-transform: uppercase; }
  #cap p { margin: 0; font-size: 22px; line-height: 1.3; color: #b7b9c0; }
  #cap .step { margin-top: 26px; font-size: 16px; letter-spacing: .25em; text-transform: uppercase; color: #6b6e78; }
  #brand { position: absolute; left: 1490px; top: 36px; font-size: 20px; letter-spacing: .3em; text-transform: uppercase; color: #6b6e78; }
  #log { position: absolute; left: 1490px; bottom: 40px; width: 400px; font-size: 16px; line-height: 1.5; color: #8d909a; }
  #log div { border-left: 3px solid #333; padding-left: 10px; margin-bottom: 6px; }
  #log div.hot { border-color: #CE1126; color: #fff; }
</style></head><body>
<div id="glow"></div>
<div id="side"></div>
<div id="brand">Room OS · live demo</div>
<div id="cap"><h1>Game Day</h1><p>Three TVs, two projected ribbons, one room. Everything here is the real app running on simulated game data.</p><div class="step">1 / 6</div></div>
<div id="log"></div>
<div id="sony"><span>Sony 70" · the broadcast</span></div>
<div class="frame" id="left"  style="left:77px; top:563px; width:327px; height:189px; z-index:2;"></div>
<div class="frame" id="right" style="left:1109px; top:563px; width:327px; height:189px; z-index:2;"></div>
<div class="frame" id="projA" style="left:490px; top:349px; width:533px; height:42px; z-index:1;"></div>
<div class="frame" id="projB" style="left:490px; top:268px; width:533px; height:42px; z-index:1;"></div>
<script>
  const q = new URLSearchParams(location.search);
  const base = q.get("base") || "http://localhost:8790";
  const mk = (id, url, w, dy = 0) => { const f = document.createElement("iframe"); f.src = url; f.style.transform = `scale(${w / 1920}) translateY(${-dy}px)`; document.getElementById(id).appendChild(f); };
  mk("left", `${base}/display/${q.get("left")}`, 327);
  mk("right", `${base}/display/${q.get("right")}`, 327);
  mk("projA", `${base}/display/projector?mode=ticker`, 533, 343);
  mk("projB", `${base}/display/projector?mode=ticker`, 533, 49);
  window.setCaption = (h, p, step) => { document.querySelector("#cap h1").textContent = h; document.querySelector("#cap p").textContent = p; document.querySelector("#cap .step").textContent = step; };
  window.setGlow = (c) => { document.getElementById("glow").style.background = c; };
  window.addLog = (t, hot) => { const d = document.createElement("div"); d.textContent = t; if (hot) d.className = "hot"; const l = document.getElementById("log"); l.appendChild(d); while (l.children.length > 7) l.removeChild(l.firstChild); };
</script></body></html>
